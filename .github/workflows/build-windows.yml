name: Build Windows

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Windows x64 Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cache submodule working trees + git object stores.
      # Key: sha of every submodule's pinned commit.  Changes only when
      # a submodule reference is bumped in the parent repo.
      - name: Compute submodule cache key
        id: sm-key
        shell: bash
        run: |
          echo "hash=$(git submodule status --recursive | sha256sum | head -c 16)" >> "$GITHUB_OUTPUT"

      - name: Restore submodule cache
        id: sm-cache
        uses: actions/cache@v4
        with:
          path: |
            Externals
            .git/modules
          key: submodules-win-${{ steps.sm-key.outputs.hash }}

      - name: Init submodules
        # Always run so newly-added submodules are fetched even on partial cache hits.
        run: git submodule update --init --recursive
        shell: pwsh

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      # sccache caches compiled object files across runs. On a cache hit
      # only changed translation units are recompiled.
      - name: Set up sccache
        uses: mozilla/sccache-action@v0.0.6
        with:
          version: v0.8.2

      - name: Configure CMake
        run: |
          cmake -B Build/Release `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
        shell: pwsh

      # Cache the ninja build tree (.obj / .lib files) so incremental CI
      # runs only recompile changed translation units.  Restore-keys allow
      # a partial hit when the source hash changes so ninja still benefits
      # from reusing unchanged objects.
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: Build/Release
          key: build-win-${{ hashFiles('Source/**', 'CMakeLists.txt', 'CMakeSettings.json') }}-${{ steps.sm-key.outputs.hash }}
          restore-keys: |
            build-win-

      - name: Build
        run: cmake --build Build/Release --config Release --parallel
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dolphin-Py3.12-x64-${{ github.sha }}
          path: Binary/x64/
          retention-days: 30

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Dolphin-Py3.12-x64-${{ github.sha }}
          path: artifact/

      - name: Zip artifact
        run: |
          cd artifact
          zip -r ../Dolphin-Py3.12-x64.zip .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: Automated build from commit ${{ github.sha }}
          files: Dolphin-Py3.12-x64.zip
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
